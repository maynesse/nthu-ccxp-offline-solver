name: Check release source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned development tools
        run: npm ci --ignore-scripts
      - name: Mozilla validation
        run: npm run lint
      - name: Validate the source and manifest
        run: python scripts/check_project.py
      - name: Check local recognizer
        run: npm test
      - name: Build AMO package
        run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release
          path: dist/
